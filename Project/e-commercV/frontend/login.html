<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce - Connexion</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="nav-container">
                <div class="nav-logo">
                    <h1><a href="/" style="color: white; text-decoration: none;">E-Shop</a></h1>
                </div>
                <ul class="nav-menu">
                    <li class="nav-item">
                        <a href="/" class="nav-link">Accueil</a>
                    </li>
                    <li class="nav-item">
                        <a href="/products" class="nav-link">Produits</a>
                    </li>
                    <li class="nav-item">
                        <a href="/register" class="nav-link">Inscription</a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <div class="form-container">
            <h1 class="page-title">Connexion</h1>
            
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email :</label>
                    <input type="email" id="email" name="email" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Mot de passe :</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%;">Se connecter</button>
            </form>
            
            <div style="text-align: center; margin-top: 1rem;">
                <p>Pas encore inscrit ? <a href="/register">Créer un compte</a></p>
                <p><small>Pour tester : admin@ecommerce.com / admin123</small></p>
            </div>
        </div>
    </main>

    <script src="js/common.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            await login(email, password);
        });
        
        // Rediriger si déjà connecté
        document.addEventListener('DOMContentLoaded', async function() {
            const isAuth = await checkAuthStatus();
            if (isAuth) {
                window.location.href = '/';
            }
        });
    </script>
</body>
</html>
